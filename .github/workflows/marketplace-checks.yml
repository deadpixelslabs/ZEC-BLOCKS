name: Marketplace checks
on:
  push:
    branches: [main, 'codex/marketplace-*']
  pull_request:
permissions:
  contents: read
jobs:
  rh20-holders:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-holders
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-holders
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false pg@8.23.0 ethers@6.13.5 @foundry-rs/anvil-linux-amd64@1.7.1
      - name: Verify canonical holder accounting and private database permissions
        run: node --test tests/rh20-holders.cjs
  rh20:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned RH-20 tooling
        run: npm install --no-save --package-lock=false solc@0.8.26 ethers@6.13.5 @foundry-rs/anvil-linux-amd64@1.7.1 playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Check reproducible contract and isolated settlement flows
        run: |
          node scripts/build-rh20-market.cjs --check
          node scripts/build-rh20-sweep.cjs --check
          node --check rh20/market.js
          node --check rh20/sweep.js
          node --test tests/rh20-price.cjs
          node --test tests/rh20-market-contract.cjs
          node --test tests/rh20-sweep-contract.cjs
          node --test tests/rh20-market-browser.cjs
          node --test tests/rh20-sweep-browser.cjs
      - name: Verify the owner-deployed marketplace through mainnet RPC
        run: |
          mkdir -p test-results/rh20
          node scripts/publish-rh20-market.cjs --tx 0x1977c9e7ce769c63a43207259f92057f65070f871f5503eca816cecd310ebc18 --address 0x3E6E91232CE0895C6154b66800ee5c8B8EE83CFC --check > test-results/rh20/verified-deployment.json
          cat test-results/rh20/verified-deployment.json
      - name: Verify published pages and read-only chain access
        if: github.ref == 'refs/heads/main'
        run: node tests/rh20-market-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh20-marketplace-evidence
          path: test-results/rh20/
          if-no-files-found: ignore
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test protocol/tests/*.test.mjs
      - run: node protocol/cli.mjs prepare-spec /tmp/spec-anchor-request.json
      - run: diff -u protocol/spec-anchor-request.json /tmp/spec-anchor-request.json
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js && node --check market-runtime.js && node --check navigation.js && node --check address-identity.js && node --test tests/runtime.test.cjs tests/address-identity.test.cjs tests/activity-privacy.test.cjs tests/listing-fee.test.cjs
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/marketplace.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-browser-checks
          path: test-results/

  listing-fee-database:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/listing-fee-db-setup.sql
      - run: for file in supabase/migrations/*_native_zec_listing_fee.sql; do psql -v ON_ERROR_STOP=1 -f "$file"; done
      - run: psql -v ON_ERROR_STOP=1 -f tests/listing-fee-db.sql
