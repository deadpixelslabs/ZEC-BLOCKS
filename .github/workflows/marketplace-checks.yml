name: Marketplace checks
on:
  push:
    branches: [main, 'codex/marketplace-*']
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test protocol/tests/*.test.mjs
      - run: node protocol/cli.mjs prepare-spec /tmp/spec-anchor-request.json
      - run: diff -u protocol/spec-anchor-request.json /tmp/spec-anchor-request.json
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js && node --check market-runtime.js && node --check navigation.js && node --check address-identity.js && node --test tests/runtime.test.cjs tests/address-identity.test.cjs tests/activity-privacy.test.cjs
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/marketplace.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-browser-checks
          path: test-results/
