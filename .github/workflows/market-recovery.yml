name: Marketplace recovery verification
on:
  push:
    branches: [fix/market-recovery-modern-ui]
    paths: ['.github/workflows/market-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe public read transport
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const src=fs.readFileSync('api/index.js','utf8');
            const db=src.match(/SUPABASE_URL\s*=\s*['"]([^'"]+)/)[1];
            const key=src.match(/SUPABASE_ANON\s*=\s*['"]([^'"]+)/)[1];
            const results=[];
            for(const action of ['health','usdc','stats','activity']){
              const t=Date.now();
              try{
                const r=await fetch(db+'/functions/v1/zecblocks-public-read',{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+key},body:JSON.stringify({action}),signal:AbortSignal.timeout(12000)});
                const j=await r.json();const item={action,status:r.status,ms:Date.now()-t,transport:j?.transport,rows:j?.data?.usdc_listings?.length,error:j?.error,details:j?.data?.indexer_health};console.log('DIRECT_READ '+JSON.stringify(item));results.push(item);if(r.ok)fs.writeFileSync('read-'+action+'.json',JSON.stringify(j));
              }catch(e){const item={action,ms:Date.now()-t,error:e.message};console.log('DIRECT_READ '+JSON.stringify(item));results.push(item)}
            }
            fs.writeFileSync('diagnostics.json',JSON.stringify(results,null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-read-diagnostics
          path: |
            diagnostics.json
            read-*.json
          retention-days: 3
