name: Marketplace runtime diagnostic
on:
  push:
    branches: ['diagnostics/market-runtime-20260921']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-runtime-diagnostic
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Isolate Supabase gateway versus PostgREST
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const dns=require('node:dns/promises');
          (async()=>{
            const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/api/index.js?ref=main`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            const f=await r.json(),src=Buffer.from(f.content,'base64').toString();
            const legacy=src.match(/SUPABASE_ANON\s*=\s*['"]([^'"]+)/)?.[1];
            const modern='sb_publishable_LoJpIG8DU4ulRJtQOTY8QA_4AWXNeVN';
            const db='https://tvwvenyomlwvjtwxasca.supabase.co';
            console.log('DNS '+JSON.stringify(await dns.lookup(new URL(db).hostname,{all:true})));
            const tests=[
              ['no_key','/rest/v1/',null,false],
              ['modern_auth','/auth/v1/health',modern,false],
              ['legacy_auth','/auth/v1/health',legacy,false],
              ['modern_tiny_read','/rest/v1/zecblocks_tokens?select=token_id&limit=1',modern,false],
              ['legacy_tiny_read','/rest/v1/zecblocks_tokens?select=token_id&limit=1',legacy,true],
              ['modern_board','/rest/v1/rpc/zecblocks_usdc_market_board',modern,false],
              ['legacy_board','/rest/v1/rpc/zecblocks_usdc_market_board',legacy,true],
              ['modern_stats','/functions/v1/zecblocks-live-stats',modern,false]
            ];
            async function probe([name,path,key,bearer]){
              const start=Date.now();
              try{
                const post=path.includes('/rpc/');
                const x=await fetch(db+path,{method:post?'POST':'GET',headers:{accept:'application/json',...(key?{apikey:key}:{}),...(bearer?{authorization:'Bearer '+key}:{}),...(post?{'content-type':'application/json'}:{})},...(post?{body:'{}'}:{}),signal:AbortSignal.timeout(10000)});
                const text=await x.text();let j;try{j=JSON.parse(text)}catch{}
                console.log('LAYER '+JSON.stringify({name,ms:Date.now()-start,status:x.status,type:x.headers.get('content-type'),rows:j?.usdc_listings?.length,metrics:j?.usdc_metrics,error:j?.error||j?.message,body:path.includes('/rpc/')?undefined:text.slice(0,300)}));
              }catch(e){console.log('LAYER '+JSON.stringify({name,ms:Date.now()-start,error:e.message,cause:e.cause?.code}))}
            }
            for(let i=0;i<tests.length;i+=2)await Promise.all(tests.slice(i,i+2).map(probe));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
