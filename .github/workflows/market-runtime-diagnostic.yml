name: Marketplace runtime diagnostic
on:
  push:
    branches: ['diagnostics/market-runtime-20260921']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-runtime-diagnostic
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install Chromium test harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Verify real production endpoints and fresh browser sessions
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base='https://www.zecblocks.xyz';
          (async()=>{
            let failures=0;
            for(const [name,path,method,body] of [
              ['board','/index-api/rest/v1/rpc/zecblocks_usdc_market_board','POST',{}],
              ['stats','/index-api/rest/v1/rpc/zecblocks_claim_stats','POST',{}],
              ['live','/index-api/functions/v1/zecblocks-live-stats','GET',null]
            ]){
              const t=Date.now();
              try{
                const r=await fetch(base+path,{method,headers:{accept:'application/json','content-type':'application/json'},...(body===null?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(18000)});
                const text=await r.text();let j;try{j=JSON.parse(text)}catch{}
                const valid=r.ok&&j&&j.ok!==false&&(name!=='board'||Array.isArray(j.usdc_listings));
                if(!valid)failures++;
                console.log('LIVE_CHECK '+JSON.stringify({name,status:r.status,ms:Date.now()-t,valid,rows:j?.usdc_listings?.length,metrics:j?.usdc_metrics,claims_seen:j?.claims_seen,error:j?.error||j?.message}));
              }catch(e){failures++;console.log('LIVE_CHECK '+JSON.stringify({name,ms:Date.now()-t,error:e.message}))}
            }
            const browser=await chromium.launch({headless:true});
            for(let n=1;n<=3;n++){
              const ctx=await browser.newContext();const page=await ctx.newPage();const errors=[];const failedApi=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.url().includes('/index-api/')&&r.status()>=400)failedApi.push({path:new URL(r.url()).pathname,status:r.status()})});
              await page.route('**/*',route=>{
                const r=route.request(),u=r.url();
                if(r.method()==='POST'&&u.includes('/functions/v1/')){
                  let b;try{b=r.postDataJSON()}catch{}
                  const readOnly=['snapshot','state','market','account','lookup'].includes(b?.action);
                  if(!readOnly)return route.abort('blockedbyclient');
                }
                return route.continue();
              });
              const t=Date.now();
              await page.goto(base+'/#market',{waitUntil:'domcontentloaded',timeout:45000});
              try{await page.waitForFunction(()=>document.querySelectorAll('#usdcMarketGrid .nft').length>0,{},{timeout:25000})}catch{}
              const result=await page.evaluate(()=>({cards:document.querySelectorAll('#usdcMarketGrid .nft').length,claimCount:document.getElementById('claimCount')?.innerText,status:document.getElementById('usdcMarketStatus')?.innerText,footer:document.querySelector('footer')?.innerText,metrics:typeof S==='object'?S.serverUsdcMetrics:null,connected:!!window.noirwallet}));
              if(!result.cards||errors.length)failures++;
              console.log('FRESH_BROWSER '+JSON.stringify({run:n,ms:Date.now()-t,...result,errors,failedApi}));
              await ctx.close();
            }
            await browser.close();
            console.log('REGRESSION_RESULT '+JSON.stringify({failures}));
            if(failures)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
